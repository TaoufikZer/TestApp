<meta charset="utf-8">
<title>Montréal Trip Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first app shell — header, scrolling view, fixed bottom tab bar; centred column on wide screens */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --border:#E3E7EE; --chip:#DDE2EA; --fg:#0E1A2B; --muted:#5A6578;
  --link:#1F5FAD; --active:#C8372A; --accent:#C8372A; --hero:#0E1A2B; --hero-sub:#B9C3D3;
  --inv-bg:#0E1A2B; --inv-fg:#FFFFFF; --track:#EEF1F5; --line:#C9D0DB; --dash:#AEB7C6;
  --tag-food:#9A5B00; --tag-place:#174A87; --tag-walk:#2E6B4F; --tag-activity:#8A3FA0; --tag-move:#4A5568;
  --tint-food:#FBE7D0; --tint-culture:#E4EDF9; --tint-outdoors:#DCEFE3; --trip-bg:#E4EDF9; --trip-fg:#174A87;
  --map-bg:#E8ECF1; --water:#B9D3EE; --park:#CFE3D3; --road:#FFFFFF; --park-label:#2E6B4F; --water-label:#174A87;
  --ok:#2E6B4F; --toast-bg:#0E1A2B; --toast-fg:#FFFFFF;
  --font-display:'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#151E2E; --border:#263247; --chip:#2F3B52; --fg:#E8EDF5; --muted:#9AA6B8;
  --link:#8FB8EE; --active:#F0695C; --hero:#1C2740; --hero-sub:#B9C3D3;
  --inv-bg:#E8EDF5; --inv-fg:#0B1220; --track:#222D42; --line:#33415A; --dash:#4A5872;
  --tag-food:#E8B06A; --tag-place:#9CC2F2; --tag-walk:#7CC6A0; --tag-activity:#D3A2E6; --tag-move:#AEB9C9;
  --tint-food:#3A2C1C; --tint-culture:#1D2C44; --tint-outdoors:#1C3328; --trip-bg:#1D2C44; --trip-fg:#A9C8F2;
  --map-bg:#1A2333; --water:#1E3A5C; --park:#1F3A2C; --road:#2A3548; --park-label:#8FD1AE; --water-label:#A9C8F2;
  --toast-bg:#E8EDF5; --toast-fg:#0B1220; color-scheme:dark;
}}

}
/* The app's own theme switch wins over the system and host theme */
:root[data-app-theme="light"]{
  --bg:#F3F5F8; --surface:#FFFFFF; --border:#E3E7EE; --chip:#DDE2EA; --fg:#0E1A2B; --muted:#5A6578;
  --link:#1F5FAD; --active:#C8372A; --hero:#0E1A2B; --hero-sub:#B9C3D3;
  --inv-bg:#0E1A2B; --inv-fg:#FFFFFF; --track:#EEF1F5; --line:#C9D0DB; --dash:#AEB7C6;
  --tag-food:#9A5B00; --tag-place:#174A87; --tag-walk:#2E6B4F; --tag-activity:#8A3FA0; --tag-move:#4A5568;
  --tint-food:#FBE7D0; --tint-culture:#E4EDF9; --tint-outdoors:#DCEFE3; --trip-bg:#E4EDF9; --trip-fg:#174A87;
  --map-bg:#E8ECF1; --water:#B9D3EE; --park:#CFE3D3; --road:#FFFFFF; --park-label:#2E6B4F; --water-label:#174A87;
  --toast-bg:#0E1A2B; --toast-fg:#FFFFFF; color-scheme:light;
}
:root[data-app-theme="dark"]{
  --bg:#0B1220; --surface:#151E2E; --border:#263247; --chip:#2F3B52; --fg:#E8EDF5; --muted:#9AA6B8;
  --link:#8FB8EE; --active:#F0695C; --hero:#1C2740; --hero-sub:#B9C3D3;
  --inv-bg:#E8EDF5; --inv-fg:#0B1220; --track:#222D42; --line:#33415A; --dash:#4A5872;
  --tag-food:#E8B06A; --tag-place:#9CC2F2; --tag-walk:#7CC6A0; --tag-activity:#D3A2E6; --tag-move:#AEB9C9;
  --tint-food:#3A2C1C; --tint-culture:#1D2C44; --tint-outdoors:#1C3328; --trip-bg:#1D2C44; --trip-fg:#A9C8F2;
  --map-bg:#1A2333; --water:#1E3A5C; --park:#1F3A2C; --road:#2A3548; --park-label:#8FD1AE; --water-label:#A9C8F2;
  --toast-bg:#E8EDF5; --toast-fg:#0B1220; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:20px 12px}
.top .eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.top h1{font-size:26px;letter-spacing:-.5px}
.top .tools{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--chip);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.lang-btn{height:44px;min-width:52px;padding:0 12px;border-radius:22px;border:1px solid var(--chip);background:var(--surface);font-weight:700;font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:18px;padding-block:4px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.muted{color:var(--muted)}
.small{font-size:12px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-head h2{font-size:18px}
.linkish{background:none;border:none;color:var(--link);font-weight:600;font-size:13px;padding:10px 0;text-decoration:none}
.num{font-variant-numeric:tabular-nums}

/* Home hero */
.hero{background:var(--accent);color:#FFFFFF;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero svg.peaks{position:absolute;right:-30px;bottom:-20px;opacity:.18;pointer-events:none}
.hero .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .kicker{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.95}
.hero .city{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-1px;margin-top:4px}
.hero .count{background:rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;text-align:center;min-width:72px}
.hero .count b{display:block;font-family:var(--font-display);font-size:24px;line-height:1}
.hero .dates{display:flex;gap:10px;font-size:13px}
.hero .dates > div{background:rgba(255,255,255,.18);border-radius:10px;padding:8px 10px;flex:1}
.hero .cta{background:#FFFFFF;color:#0E1A2B;border-radius:12px;min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:12px;color:var(--fg);text-decoration:none;display:block}
.tile b{display:block;font-family:var(--font-display);font-size:18px;margin-top:4px;white-space:nowrap}
.check-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px}
.check-row input[type=checkbox]{width:20px;height:20px;accent-color:#1F5FAD;flex-shrink:0}
.check-row span.txt{flex:1;font-weight:500;min-width:0}
.done .txt{text-decoration:line-through;color:var(--muted)}
.add-row{display:flex;gap:8px}
.add-row input,.add-row select{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--chip);background:var(--surface);padding:0 12px}
.add-row select{flex:0 0 auto}
.btn{height:44px;padding:0 16px;border-radius:22px;border:none;background:var(--inv-bg);color:var(--inv-fg);font-weight:600;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list-card > * + *{border-top:1px solid var(--track)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--chip);background:var(--surface);font-weight:600;font-size:13px;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.chip.red[aria-pressed="true"]{background:#C8372A;border-color:#C8372A;color:#FFFFFF}

/* Itinerary */
.day-link{display:flex;gap:12px;align-items:center;padding:12px;color:var(--fg);text-decoration:none}
.badge{width:52px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;background:var(--track)}
.badge.trip{background:var(--trip-bg);color:var(--trip-fg)}
.badge.today{background:#C8372A;color:#FFFFFF}
.badge small{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.badge b{font-family:var(--font-display);font-size:20px;line-height:1.1}
.day-link .info{flex:1;min-width:0}
.day-link .t{font-weight:600;margin-top:2px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-mini{font-size:12px;color:var(--muted);flex-shrink:0}

/* Day detail */
.day-hero{background:var(--hero);color:#FFFFFF;padding-block:14px 20px;display:flex;flex-direction:column;gap:14px}
.day-hero .nav{display:flex;justify-content:space-between}
.day-hero .nav div{display:flex;gap:8px}
.ghost{width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.14);color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.ghost[aria-disabled="true"]{opacity:.35;cursor:default}
.day-hero .k{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--hero-sub)}
.day-hero h1{font-size:28px;letter-spacing:-.5px;margin-top:4px}
.pills{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:500}
.pills span{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px}
.timeline{display:flex;flex-direction:column;padding-block:18px 8px}
.stop{display:grid;grid-template-columns:52px 16px minmax(0,1fr);column-gap:12px}
.stop .time{font-size:12px;font-weight:600;color:var(--muted);padding-top:14px;text-align:right}
.rail{display:flex;flex-direction:column;align-items:center}
.rail i{display:block;width:2px;background:var(--line)}
.rail i.a{height:16px}.rail i.b{flex:1}
.rail .dot{width:12px;height:12px;border-radius:6px;border:2px solid var(--active);background:var(--surface)}
.stop.is-done .dot{background:var(--active)}
.stop:first-child .rail i.a,.stop:last-child .rail i.b{background:transparent}
.stop .body{padding-bottom:12px}
.stop .card{padding:12px 14px;display:flex;gap:8px;align-items:flex-start}
.stop .card .main{flex:1;min-width:0}
.stop .name{font-weight:600;margin-top:2px}
.stop.is-done .name{text-decoration:line-through}
.done-btn{width:44px;height:44px;border-radius:22px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--muted);border:1.5px solid var(--chip)}
.stop.is-done .done-btn{background:var(--ok);color:#FFFFFF;border-color:var(--ok)}
.del-btn{width:36px;height:44px;border:none;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.add-stop{border:1.5px dashed var(--dash);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-left:80px}
.add-stop .add-row input[type=time]{flex:0 0 120px}

/* Explore */
.map{position:relative;border-radius:20px;overflow:hidden;background:var(--map-bg)}
.map svg{display:block;width:100%;height:auto}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.search input{border:none;outline:none;background:transparent;flex:1;min-width:0;font-size:15px}
.place{display:flex;gap:12px;align-items:center;padding:12px}
.place .ini{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-display);font-weight:700;font-size:18px}
.place .ini.food{background:var(--tint-food)}.place .ini.culture{background:var(--tint-culture)}.place .ini.outdoors{background:var(--tint-outdoors)}
.place .main{flex:1;min-width:0}
.place select{height:40px;border-radius:20px;border:1px solid var(--chip);background:var(--surface);padding:0 10px;font-weight:600;font-size:13px;max-width:130px}
.added{font-size:12px;font-weight:600;color:var(--ok);display:inline-flex;align-items:center;gap:4px}

/* Budget */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--track);border-radius:12px;padding:4px}
.seg button{height:40px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-weight:600}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.budget-hero{background:var(--hero);color:#FFFFFF;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.budget-hero .big{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:#F0A24A}
.bar.over i{background:#FF7A6B}
.total-edit{display:flex;align-items:center;gap:6px;color:var(--hero-sub);font-size:13px}
.total-edit input{width:96px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#FFFFFF;padding:0 8px;text-align:right}
.cat{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.cat .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.cat input{width:96px;height:36px;border-radius:8px;border:1px solid var(--chip);background:var(--surface);padding:0 8px;text-align:right;font-weight:600}
.cat .track{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.cat .track i{display:block;height:100%;border-radius:4px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabbar ul{list-style:none;margin:0 auto;padding:0;max-width:560px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:68px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none}
.tabbar a[aria-current="page"]{color:var(--active);font-weight:600}

/* Status + toast */
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:4px;background:var(--muted);display:inline-block}
.status.live i{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;z-index:10;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.toast button{background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;min-height:36px}
.empty{padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:380px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .add-stop{margin-left:0} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<nav class="tabbar" aria-label="Main"><ul id="tabs"></ul></nav>

/* ---------- prefs (per device) ---------- */
function getPref(k,d){ try{ return localStorage.getItem('mtl.'+k) || d; }catch(e){ return d; } }

/* ---------- state ---------- */

let mode = 'loading';       // loading | live | local | readonly | empty
let docRef = null;
let lastJSON = '';
let saveTimer = null;

const t = () => T[lang];
const tx = (v)=> v==null ? '' : (typeof v === 'string' ? v : (v[lang] || v.en || ''));

function money(n){ return new Intl.NumberFormat(loc(),{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(Math.round(n)); }
function dayDate(i){ const [y,m,d] = plan.start.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+i)); }
function fmt(date,opts){ return new Intl.DateTimeFormat(loc(),Object.assign({timeZone:'UTC'},opts)).format(date); }
function fmtTime(hm){ if(!hm) return ''; const [h,m] = hm.split(':').map(Number); if(lang==='fr') return h+' h'+(m? ' '+String(m).padStart(2,'0') : ''); return h+':'+String(m).padStart(2,'0'); }
function todayIndex(){ const now = new Date(); const today = Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()); return Math.round((today - dayDate(0).getTime())/86400000); }
function canEdit(){ return mode==='live' || mode==='local'; }

/* ---------- persistence ---------- */
function commit(mutator, opts){
  if(!canEdit() || !plan) return;
  if(opts && opts.undoable) undoPlan = JSON.parse(JSON.stringify(plan));
  mutator(plan);
  render();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 350);
}
async function save(){
  const json = JSON.stringify(plan);
  lastJSON = json;
  if(mode==='local'){ try{ localStorage.setItem('mtl.plan', json); }catch(e){} return; }
  if(mode==='live' && docRef){
    try{ await docRef.set(JSON.parse(json)); }
    catch(e){ if(e && (e.code==='invalid_argument' || e.code==='not_granted')){ mode='readonly'; render(); } else toast(t().saveFail); }
  }
}
async function loadSeed(){ const r = await fetch('./seed.json'); if(!r.ok) throw new Error('seed'); return r.json(); }

async function boot(){
  render();
  let db = null, user = null;
  try{ if(window.claude && window.claude.use){ [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } }catch(e){}
  if(db){
    const editable = user ? user.canEdit() : true;
    docRef = db.doc('trip/plan');
    docRef.onSnapshot((snap)=>{
      if(!snap.exists){ plan = null; mode = editable ? 'empty' : 'readonly'; render(); return; }
      const data = snap.data(); const json = JSON.stringify(data);
      if(json === lastJSON && plan) return;
      lastJSON = json; plan = JSON.parse(json); mode = editable ? 'live' : 'readonly'; render();
    }, ()=>{ toast(t().saveFail); });
  } else {
    let stored = null; try{ stored = localStorage.getItem('mtl.plan'); }catch(e){}
    try{ plan = stored ? JSON.parse(stored) : await loadSeed(); mode='local'; }catch(e){ plan=null; mode='empty'; }
    render();
  }
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, action){
  const el = document.getElementById('toast');
  el.innerHTML = '<span>'+esc(msg)+'</span>' + (action ? '<button type="button" data-act="undo">'+esc(action)+'</button>' : '');
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.hidden = true; }, 5000);
}

  } else {
    const groups = ['layers','docs'].map(g=>{
      const items = plan.packing.filter(p=>p.group===g).map(p=>'<label class="check-row'+(p.done?' done':'')+'"><input type="checkbox" data-act="pack" data-id="'+p.id+'"'+(p.done?' checked':'')+(canEdit()?'':' disabled')+'><span class="txt">'+esc(tx(p.label))+'</span></label>').join('');
      return '<div class="card list-card"><div class="label muted" style="padding:12px 14px 6px">'+esc(s.groups[g])+'</div>'+items+'</div>';
    }).join('');
    const n = plan.packing.filter(p=>p.done).length;
    body = '<p class="small muted" style="margin:0">'+esc(s.packed(n,plan.packing.length))+'</p>'+groups+
      (canEdit()?'<form class="add-row" data-form="pack"><label class="sr" for="pack-new">'+esc(s.addItem)+'</label><input id="pack-new" name="label" placeholder="'+esc(s.addItemPh)+'" autocomplete="off" required>'+
      '<label class="sr" for="pack-group">'+esc(s.type)+'</label><select id="pack-group" name="group"><option value="layers">'+esc(s.groups.layers)+'</option><option value="docs">'+esc(s.groups.docs)+'</option></select>'+
      '<button class="btn" type="submit">'+svg(ICON.plus,16,2)+esc(s.add)+'</button></form>':'');
  }
  return header('CAD', s.budgetTitle) + '<main class="view pad"><div class="seg" role="tablist" aria-label="'+esc(s.budgetTitle)+'">'+tabs+'</div>'+body+statusLine()+'</main>';
}

function viewPlaceholder(){
  const s=t();
  if(mode==='loading') return header('Montréal', s.yourTrip)+'<main class="view pad"><div class="card empty"><p class="muted" style="margin:0">'+esc(s.loading)+'</p></div></main>';
  return header('Montréal', s.yourTrip)+'<main class="view pad"><div class="card empty"><h2>'+esc(s.empty)+'</h2><p class="muted" style="margin:0">'+esc(s.emptyBody)+'</p>'+
    (mode==='empty'?'<button type="button" class="btn" data-act="load-sample">'+esc(s.loadSample)+'</button>':'<p class="small muted">'+esc(s.readonly)+'</p>')+'</div></main>';
}

/* ---------- render ---------- */
function render(){
  document.documentElement.lang = lang;
  if(appTheme) document.documentElement.setAttribute('data-app-theme', appTheme); else document.documentElement.removeAttribute('data-app-theme');
  const r = route(); const s=t();
  const el = document.getElementById('app');
  const active = document.activeElement; const activeId = active && active.id; const selStart = active && active.selectionStart;
  if(!plan) el.innerHTML = viewPlaceholder();
  else if(r.name==='itinerary') el.innerHTML = viewItinerary();
  else if(r.name==='day') el.innerHTML = viewDay(r.i);
  else if(r.name==='explore') el.innerHTML = viewExplore();
  else if(r.name==='budget') el.innerHTML = viewBudget();
  else el.innerHTML = viewHome();
  if(activeId){ const again = document.getElementById(activeId); if(again){ again.focus(); try{ if(selStart!=null) again.setSelectionRange(selStart,selStart); }catch(e){} } }
  const cur = r.name==='day' ? 'itinerary' : r.name;
  document.querySelector('.tabbar').setAttribute('aria-label', s.navLabel);
  document.getElementById('tabs').innerHTML = [['home',s.home],['itinerary',s.itinerary],['explore',s.explore],['budget',s.budget]].map(([id,l])=>
    '<li><a href="#'+id+'"'+(cur===id?' aria-current="page"':'')+'>'+svg(ICON[id],22)+esc(l)+'</a></li>').join('');
}

/* ---------- events ---------- */
document.addEventListener('click', (e)=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if(act==='lang'){ lang = lang==='fr'?'en':'fr'; setPref('lang',lang); render(); }
  else if(act==='theme'){
    const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
    appTheme = dark ? 'light' : 'dark'; setPref('theme',appTheme); render();
  }
  else if(act==='itin-filter'){ ui.itinFilter = id; render(); }
  else if(act==='explore-cat'){ ui.exploreCat = id; render(); }
  else if(act==='budget-tab'){ ui.budgetTab = id; render(); }
  else if(act==='stop-done'){ const di=+b.dataset.day; commit(p=>{ const st=p.days[di].stops.find(x=>x.id===id); if(st) st.done=!st.done; }); }
  else if(act==='del-stop'){ const di=+b.dataset.day; commit(p=>{ p.days[di].stops = p.days[di].stops.filter(x=>x.id!==id); }, {undoable:true}); toast(t().removed, t().undo); }
  else if(act==='undo'){ if(undoPlan){ const prev = undoPlan; undoPlan=null; commit(p=>{ Object.assign(p, prev); }); } document.getElementById('toast').hidden = true; }
  else if(act==='load-sample'){ b.disabled = true; loadSeed().then(seed=>{ plan = seed; mode = docRef ? 'live' : 'local'; render(); save(); }).catch(()=>{ b.disabled=false; toast(t().saveFail); }); }
});
document.addEventListener('change', (e)=>{
  const el = e.target; const act = el.dataset && el.dataset.act; if(!act) return;
  if(act==='todo') commit(p=>{ const x=p.todos.find(y=>y.id===el.dataset.id); if(x) x.done = el.checked; });
  else if(act==='pack') commit(p=>{ const x=p.packing.find(y=>y.id===el.dataset.id); if(x) x.done = el.checked; });
  else if(act==='cat-amount') commit(p=>{ const c=p.budget.cats.find(y=>y.id===el.dataset.id); if(c) c.amount = Math.max(0, Math.round(+el.value||0)); });
  else if(act==='total') commit(p=>{ p.budget.total = Math.max(0, Math.round(+el.value||0)); });
  else if(act==='add-place' && el.value!==''){
    const di = +el.value; const pl = plan.places.find(x=>x.id===el.dataset.id);
    commit(p=>{ p.days[di].stops.push({id:uid(), time:'12:00', tag:pl.tag||'place', name:pl.name, note:pl.meta, placeId:pl.id, done:false}); });
    toast(t().addedTo(di+1));
  }
});
document.addEventListener('input', (e)=>{
  if(e.target.id==='explore-q'){ ui.query = e.target.value; const l = document.getElementById('place-list'); if(l) l.innerHTML = exploreList(); }
});
document.addEventListener('submit', (e)=>{
  const f = e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const data = new FormData(f); const kind = f.dataset.form;
  if(kind==='todo'){ const label = String(data.get('label')||'').trim(); if(!label) return; commit(p=>{ p.todos.push({id:uid(), label, when:'', done:false}); }); }
  else if(kind==='pack'){ const label = String(data.get('label')||'').trim(); if(!label) return; commit(p=>{ p.packing.push({id:uid(), group:String(data.get('group')), label, done:false}); }); }
  else if(kind==='stop'){ const name = String(data.get('name')||'').trim(); if(!name) return; const di = +f.dataset.day;
    commit(p=>{ p.days[di].stops.push({id:uid(), time:String(data.get('time')||'12:00'), tag:String(data.get('tag')||'place'), name, note:'', done:false}); }); }
  const first = document.querySelector('form[data-form="'+kind+'"] input'); if(first){ first.value=''; first.focus(); }
});
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

boot();
})();
</script>
